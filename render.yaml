databases:
  - name: campus-student-db
    databaseName: campus_students
    user: campus_students
    plan: basic-256mb

services:
  - type: web
    name: campus-student-portal
    runtime: python
    plan: basic-256mb
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /login/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DJANGO_ALLOWED_HOSTS
        value: campus-student-portal.onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://campus-student-portal.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: campus-student-db
          property: connectionString
