<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campus Student Portal</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e0e7ff, #f5f3ff);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            width: 100%;
            max-width: 650px;
            padding: 45px 25px;
            text-align: center;
            border-radius: 20px;
            box-shadow: 0 10px 35px #00000015;
        }

        .icon {
            font-size: 55px;
        }

        h1 {
            color: #4338ca;
            margin-bottom: 12px;
        }

        p {
            color: #64748b;
            line-height: 1.7;
        }

        .button {
            display: inline-block;
            margin-top: 20px;
            padding: 14px 25px;
            background: #4f46e5;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            font-weight: bold;
        }

        .button:hover {
            background: #3730a3;
        }

        footer {
            margin-top: 30px;
            font-size: 13px;
            color: #94a3b8;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="icon">🎓</div>

        <h1>Campus Student Portal</h1>

        <p>
            Welcome to the Campus Student Portal.
            Access the student directory, search student records,
            and manage student information through our Django application.
        </p>

        <a class="button"
           href="https://django-student-app-1.onrender.com/login/">
            Open Student Portal →
        </a>

        <footer>
            Built with Django · Python · HTML · CSS
        </footer>
    </main>
</body>
</html>
