<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }} · Campus</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:#f5f7fb;color:#172b4d;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;padding:34px 20px}header{max-width:760px;margin:0 auto 28px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:19px;font-weight:750;color:#3457d5;text-decoration:none}.back{color:#52627a;text-decoration:none;font-weight:600}.card{max-width:760px;margin:auto;background:#fff;border:1px solid #e5eaf1;border-radius:16px;padding:32px;box-shadow:0 12px 40px #23345a0a}.eyebrow{font-size:12px;color:#3457d5;text-transform:uppercase;letter-spacing:.1em;font-weight:750}.card h1{font-size:28px;letter-spacing:-.7px;margin:8px 0}.intro{color:#718096;margin:0 0 26px}.field{margin:18px 0}.field label{display:block;font-size:13px;font-weight:650;margin-bottom:7px}.field input{width:100%;padding:12px;border:1px solid #dce3ed;border-radius:9px;font:inherit}.field input:focus{outline:3px solid #3457d522;border-color:#3457d5}.errorlist{padding:0;list-style:none;color:#b42332;font-size:13px;margin:6px 0}.actions{display:flex;gap:10px;margin-top:26px}.actions button,.actions a{border:0;border-radius:9px;padding:11px 16px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}.primary{background:#3457d5;color:white}.secondary{background:#eef1f6;color:#45546a}@media(max-width:540px){body{padding:22px 14px}.card{padding:23px}.actions{flex-direction:column}.actions>*{text-align:center}}
  </style>
</head><body>
  <header><a class="brand" href="{% url 'dashboard' %}">● Campus</a><a class="back" href="{% url 'dashboard' %}">← Back to students</a></header>
  <main class="card"><div class="eyebrow">Student directory</div><h1>{{ title }}</h1><p class="intro">Enter the student details below. Email addresses must be unique.</p>
    <form method="post">{% csrf_token %}
      {% for field in form %}<div class="field">{{ field.label_tag }}{{ field }}{% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}{{ field.errors }}</div>{% endfor %}
      <div class="actions"><button class="primary" type="submit">Save student</button><a class="secondary" href="{% url 'dashboard' %}">Cancel</a></div>
    </form>
  </main>
</body></html>
