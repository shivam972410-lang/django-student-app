<!doctype html>
<html lang="en"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Delete student · Campus</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f7fb;color:#172b4d;font:15px system-ui,-apple-system,"Segoe UI",sans-serif;padding:20px}.card{max-width:480px;width:100%;background:white;border:1px solid #e5eaf1;border-radius:16px;padding:32px;box-shadow:0 12px 40px #23345a0a}.icon{width:46px;height:46px;display:grid;place-items:center;background:#fff0f0;color:#b42332;border-radius:13px;font-size:22px}.card h1{font-size:24px;letter-spacing:-.5px;margin:20px 0 8px}.card p{color:#64748b;line-height:1.6}.student{font-weight:700;color:#172b4d}.actions{display:flex;gap:10px;margin-top:24px}.actions button,.actions a{padding:11px 15px;border:0;border-radius:9px;font:inherit;font-weight:650;text-decoration:none;cursor:pointer}.danger{background:#b42332;color:#fff}.cancel{background:#eef1f6;color:#45546a}
  </style>
</head><body><main class="card">
  <div class="icon" aria-hidden="true">!</div><h1>Delete this student?</h1>
  <p>You’re about to remove <span class="student">{{ student.name }}</span> ({{ student.email }}) from the directory. This can’t be undone.</p>
  <div class="actions"><form method="post">{% csrf_token %}<button class="danger" type="submit">Yes, delete student</button></form><a class="cancel" href="{% url 'dashboard' %}">Cancel</a></div>
</main></body></html>
